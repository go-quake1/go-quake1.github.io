baseURL = "https://go-quake1.github.io/"
title = "go-quake1"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[markup.goldmark.renderer]
  unsafe = true

# Each repo card. "result" is the honest one-line blurb (role + what is true).
# "kind" = the layer: engine / common / model / vm / brand.
[[params.repos]]
  name = "engine"
  accel = "common · models · progs (QuakeC VM) · server · client · sound"
  kind = "engine"
  result = "The Quake engine in pure Go. Hand-ported from tyrquake-NQ commit 6531579. 22 packages at 100% statement coverage today (common + models + progs + bspfile + bsptrace); server / client / sound / backend in flight. CGO_ENABLED=0, 6-arch CI, BSD-3 wrapper + GPL-2 engine carve-out."
[[params.repos]]
  name = "brand"
  accel = "Logos, favicons, social previews"
  kind = "brand"
  result = "Brand assets — SVG / PNG / JPG / ICO / ICNS in color, white-transparent and black-transparent variants. Drives this landing, the engine README banner, and the org avatar."

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 14.07:1, bright on the dark background 3.26:1.
  base = "#5a0c0c"
  deep = "#370707"
  bright = "#b83232"
  shadow = "rgba(90,12,12,.7)"
  glow = "rgba(90,12,12,.6)"
  wash = "rgba(90,12,12,.10)"
  washDeep = "rgba(55,7,7,.06)"
  chipBg = "#f6e6e6"
  chipBorder = "#eac2c2"
  chipFg = "#370707"
  chipBgDark = "rgba(184,50,50,.14)"
  chipBorderDark = "rgba(184,50,50,.32)"
  chipFgDark = "#d88e8e"
  statsEnd = "#eecece"
  bandText = "#f4dede"

# The strip under the top bar: the code's licence and cgo, and the data
# shipped under its own licence (read from its licence files).
[params.mantra]
  items = ["LICENSE=BSD-3-Clause", "CGO_ENABLED=0", "engine: GPL-2.0-or-later"]
